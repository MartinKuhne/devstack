type Project {
  id: UUID!
  name: String
  description: String
  architecture: String
  memory: String
  githubUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProjectPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  totalCount: Int!
}

type ProjectConnection {
  nodes: [Project!]!
  pageInfo: ProjectPageInfo!
  totalCount: Int!
}

type Feature {
  id: UUID!
  projectId: UUID!
  epicId: UUID
  title: String!
  description: String
  acceptanceCriteria: String
  plan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  openQuestions: String
  status: FeatureStatus!
  result: String
  errors: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum FeatureStatus {
  Planned
  Analysis
  Development
  Code
  Review
  InReview
  Passed
  Failed
}

type FeaturePageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  totalCount: Int!
}

type FeatureConnection {
  nodes: [Feature!]!
  pageInfo: FeaturePageInfo!
  totalCount: Int!
}

type Defect {
  id: UUID!
  projectId: UUID!
  parentFeatureId: UUID
  severity: Severity
  title: String!
  description: String
  acceptanceCriteria: String
  plan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  openQuestions: String
  status: FeatureStatus!
  result: String
  errors: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum Severity {
  Critical
  High
  Medium
  Low
}

type DefectPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  totalCount: Int!
}

type DefectConnection {
  nodes: [Defect!]!
  pageInfo: DefectPageInfo!
  totalCount: Int!
}

type Task {
  id: UUID!
  featureId: UUID!
  title: String!
  deliverable: String
  acceptanceCriteria: String
  risks: String
  result: String
  requiredFollowUps: String
  complexityRating: Int!
  status: TaskStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum TaskStatus {
  Planned
  Analysis
  Development
  Code
  Review
  InReview
  Passed
  Failed
}

type TaskPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  totalCount: Int!
}

type TaskConnection {
  nodes: [Task!]!
  pageInfo: TaskPageInfo!
  totalCount: Int!
}

type Epic {
  id: UUID!
  title: String!
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EpicPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  totalCount: Int!
}

type EpicConnection {
  nodes: [Epic!]!
  pageInfo: EpicPageInfo!
  totalCount: Int!
}

type ModelConfiguration {
  id: UUID!
  projectId: UUID!
  url: String!
  model: String!
  modelAlias: String
  maxComplexity: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type WorkflowRun {
  id: UUID!
  projectId: UUID!
  featureId: UUID
  taskId: UUID
  workflowType: WorkflowType!
  status: WorkflowRunStatus!
  inputPayload: String!
  outputPayload: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum WorkflowType {
  Planner
  DevLead
  Coder
  Tester
  Architect
}

enum WorkflowRunStatus {
  Pending
  Running
  Completed
  Failed
  Cancelled
}

type DashboardSummary {
  projectsInFlight: Int!
  featuresInReview: Int!
  featuresFailed: Int!
  tasksInProgress: Int!
  tasksFailed: Int!
  recentAuditEvents: [AuditEvent!]!
}

type AuditEvent {
  id: UUID!
  entityId: UUID!
  entityType: String!
  action: String!
  userId: String
  oldValues: String
  newValues: String
  occurredAt: DateTime!
}

scalar UUID
scalar DateTime

type Query {
  getProjectById(id: UUID!): Project
  getProjects(first: Int, skip: Int): ProjectConnection!
  getFeatures(projectId: UUID, epicId: UUID, status: [FeatureStatus!], createdAfter: DateTime, createdBefore: DateTime, first: Int, skip: Int): FeatureConnection!
  getFeatureById(id: UUID!): Feature
  getDefects(projectId: UUID, first: Int, skip: Int): DefectConnection!
  getDefectById(id: UUID!): Defect
  getTasks(featureId: UUID, status: [TaskStatus!], createdAfter: DateTime, createdBefore: DateTime, first: Int, skip: Int): TaskConnection!
  getTaskById(id: UUID!): Task
  getEpics(title: String, first: Int, skip: Int): EpicConnection!
  getEpicById(id: UUID!): Epic
  getModelConfigurations(projectId: UUID!): [ModelConfiguration!]!
  getValidStatusTransitions(featureId: UUID!): [FeatureStatus!]!
  getDashboardSummary: DashboardSummary!
}

input CreateProjectInput {
  name: String!
  description: String
  architecture: String
  memory: String
  githubUrl: String
}

input UpdateProjectInput {
  id: UUID!
  name: String
  description: String
  architecture: String
  memory: String
  githubUrl: String
  githubToken_Encrypted: String
}

input DeleteProjectInput {
  id: UUID!
}

type ProjectPayload {
  project: Project
  errors: [String!]!
}

input CreateFeatureInput {
  projectId: UUID!
  title: String!
  description: String
  acceptanceCriteria: String
  plan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  openQuestions: String
