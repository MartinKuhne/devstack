input UpdateFeatureInput {
  id: UUID!
  title: String
  description: String
  acceptanceCriteria: String
  plan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  openQuestions: String
}

input TransitionFeatureInput {
  id: UUID!
  targetStatus: FeatureStatus!
  actor: String!
}

input DeleteFeatureInput {
  id: UUID!
}

type FeaturePayload {
  feature: Feature
  errors: [String!]!
}

input CreateDefectInput {
  projectId: UUID!
  parentFeatureId: UUID
  severity: Severity
  title: String!
  description: String
  acceptanceCriteria: String
  plan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  openQuestions: String
  initialStatus: FeatureStatus
}

input UpdateDefectInput {
  id: UUID!
  title: String
  description: String
  acceptanceCriteria: String
  plan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  openQuestions: String
}

input TransitionDefectInput {
  id: UUID!
  targetStatus: FeatureStatus!
  actor: String!
}

input DeleteDefectInput {
  id: UUID!
}

type DefectPayload {
  defect: Defect
  errors: [String!]!
}

input CreateTaskInput {
  featureId: UUID!
  title: String!
  deliverable: String
  acceptanceCriteria: String
  risks: String
  result: String
  requiredFollowUps: String
  complexityRating: Int!
}

input UpdateTaskInput {
  id: UUID!
  title: String
  deliverable: String
  acceptanceCriteria: String
  risks: String
  result: String
  requiredFollowUps: String
  complexityRating: Int
}

input TransitionTaskInput {
  id: UUID!
  targetStatus: TaskStatus!
  actor: String!
}

input DeleteTaskInput {
  id: UUID!
}

type TaskPayload {
  task: Task
  errors: [String!]!
}

input CreateModelConfigurationInput {
  projectId: UUID!
  url: String!
  model: String!
  modelAlias: String
  apiKey: String!
  maxComplexity: Int!
}

input UpdateModelConfigurationInput {
  id: UUID!
  url: String
  model: String
  modelAlias: String
  apiKey: String
  maxComplexity: Int
}

input DeleteModelConfigurationInput {
  id: UUID!
}

type ModelConfigurationPayload {
