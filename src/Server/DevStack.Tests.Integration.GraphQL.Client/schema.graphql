type Mutation {
  createProject(input: CreateProjectInput!): ProjectPayload!
  updateProject(input: UpdateProjectInput!): ProjectPayload!
  deleteProject(input: DeleteProjectInput!): ProjectPayload!
  createFeature(input: CreateFeatureInput!): FeaturePayload!
  updateFeature(input: UpdateFeatureInput!): FeaturePayload!
  transitionFeatureStatus(input: TransitionFeatureInput!): FeaturePayload!
  deleteFeature(input: DeleteFeatureInput!): FeaturePayload!
  createDefect(input: CreateDefectInput!): DefectPayload!
  updateDefect(input: UpdateDefectInput!): DefectPayload!
  transitionDefectStatus(input: TransitionDefectInput!): DefectPayload!
  deleteDefect(input: DeleteDefectInput!): DefectPayload!
  createTask(input: CreateTaskInput!): TaskPayload!
  updateTask(input: UpdateTaskInput!): TaskPayload!
  transitionTaskStatus(input: TransitionTaskInput!): TaskPayload!
  deleteTask(input: DeleteTaskInput!): TaskPayload!
  createModelConfiguration(input: CreateModelConfigurationInput!): ModelConfigurationPayload!
  updateModelConfiguration(input: UpdateModelConfigurationInput!): ModelConfigurationPayload!
  deleteModelConfiguration(input: DeleteModelConfigurationInput!): ModelConfigurationPayload!
  createWorkflowRun(input: CreateWorkflowRunInput!): WorkflowRunPayload!
  updateWorkflowRun(input: UpdateWorkflowRunInput!): WorkflowRunPayload!
  cancelWorkflowRun(input: CancelWorkflowRunInput!): WorkflowRunPayload!
  createEpic(input: CreateEpicInput!): EpicPayload!
  updateEpic(input: UpdateEpicInput!): EpicPayload!
  deleteEpic(input: DeleteEpicInput!): EpicPayload!
}
