}

input CreateWorkflowRunInput {
  projectId: UUID!
  featureId: UUID
  taskId: UUID
  workflowType: WorkflowType!
  inputPayload: String!
}

input UpdateWorkflowRunInput {
  id: UUID!
  status: WorkflowRunStatus!
