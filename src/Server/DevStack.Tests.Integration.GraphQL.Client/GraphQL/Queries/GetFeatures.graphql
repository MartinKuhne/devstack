query GetFeatures($status: [FeatureStatus!], $first: Int, $skip: Int) {
  features(status: $status, first: $first, skip: $skip) {
    nodes {
      id
      projectId
      title
      status
      createdAt
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      totalCount
    }
    totalCount
  }
}