query GetTasks($featureId: UUID, $status: [TaskStatus!], $first: Int, $skip: Int) {
  getTasks(featureId: $featureId, status: $status, first: $first, skip: $skip) {
    nodes {
      id
      featureId
      title
      complexityRating
      status
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      totalCount
    }
    totalCount
  }
}