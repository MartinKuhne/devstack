query GetTasks($itemId: UUID, $status: [TaskStatus!], $first: Int, $skip: Int) {
  tasks(itemId: $itemId, status: $status, first: $first, skip: $skip) {
    nodes {
      id
      featureId
      title
      complexityRating
      status
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      totalCount
    }
    totalCount
  }
}