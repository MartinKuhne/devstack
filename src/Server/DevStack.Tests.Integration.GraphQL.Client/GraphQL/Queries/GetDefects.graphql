query GetDefects($projectId: UUID, $first: Int, $skip: Int) {
  defects(projectId: $projectId, first: $first, skip: $skip) {
    nodes {
      id
      projectId
      title
      severity
      status
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      totalCount
    }
    totalCount
  }
}