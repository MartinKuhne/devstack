query GetEpics($projectId: UUID, $first: Int, $skip: Int) {
  items(projectId: $projectId, subtype: [EPIC], first: $first, skip: $skip) {
    nodes {
      id
      title
      description
      createdAt
      updatedAt
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      totalCount
    }
    totalCount
  }
}
