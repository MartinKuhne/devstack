type Query {
  projectById(id: UUID!): Project
  projects(first: Int! = 50 skip: Int): ProjectConnection!
  items(projectId: UUID epicId: UUID status: [FeatureStatus!] subtype: [ItemSubtype!] createdAfter: DateTime createdBefore: DateTime first: Int! = 50 skip: Int): ItemConnection!
  getItemById(id: UUID!): Item
  deliverableById(id: UUID!): Deliverable
  tasks(itemId: UUID status: [TaskStatus!] createdAfter: DateTime createdBefore: DateTime first: Int! = 50 skip: Int): TaskConnection!
  largeLanguageModels(projectId: UUID): [LargeLanguageModel!]!
  dashboardSummary: DashboardSummary!
}

type ProjectConnection {
  nodes: [Project!]!
  pageInfo: ProjectPageInfo!
  totalCount: Int!
