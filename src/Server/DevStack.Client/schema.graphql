schema {
  query: Query
  mutation: Mutation
}

input CreateProjectInput {
  name: String!
  description: String
  architecture: String
  memory: String
  githubUrl: String
}

input UpdateProjectInput {
  id: UUID!
  name: String
  description: String
  architecture: String
  memory: String
  githubUrl: String
  githubToken_Encrypted: String
}

input DeleteProjectInput {
  id: UUID!
}

input CreateDeliverableInput {
  projectId: UUID!
  title: String!
  type: String!
  description: String
  acceptanceCriteria: String
  agentFeedback: String
  executionPlan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  blocking: String
  initialStatus: DeliverableStatus
}

input UpdateDeliverableInput {
  id: UUID!
  title: String
  description: String
  acceptanceCriteria: String
  agentFeedback: String
  executionPlan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  blocking: String
  result: String
  errors: String
}

input TransitionDeliverableInput {
  id: UUID!
  targetStatus: DeliverableStatus!
  actor: String!
}

input DeleteDeliverableInput {
  id: UUID!
}

input CreateAgentTaskInput {
  projectId: UUID!
  deliverableId: UUID!
  title: String!
  complexityRating: Int!
  result: String
  errors: String
  commitHash: String
  dependsOnDevTask: String
  promptTokens: Int
  completionTokens: Int
  executionDurationInSeconds: Float
  model: String
}

input UpdateAgentTaskInput {
  id: UUID!
  title: String
  result: String
  errors: String
  commitHash: String
  dependsOnDevTask: String
  complexityRating: Int
  promptTokens: Int
  completionTokens: Int
  executionDurationInSeconds: Float
  model: String
}

input TransitionAgentTaskInput {
  id: UUID!
  targetStatus: AgentTaskStatus!
  actor: String!
}

input DeleteAgentTaskInput {
  id: UUID!
}

input CreateLargeLanguageModelInput {
  projectId: UUID!
  url: String!
  model: String!
  modelAlias: String
  apiKey: String!
  maxComplexity: Int!
  maxConcurrency: Int
}

input UpdateLargeLanguageModelInput {
  id: UUID!
  url: String
  model: String
  modelAlias: String
  apiKey: String
  maxComplexity: Int
  maxConcurrency: Int
}

input DeleteLargeLanguageModelInput {
  id: UUID!
}

type ProjectPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  totalCount: Int!
}

type ItemPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  totalCount: Int!
}

type ProjectPayload {
  project: Project
  errors: [String!]!
}

type DeliverablePayload {
  deliverable: Deliverable
  errors: [String!]!
}

type AgentTaskPayload {
  agentTask: AgentTask
  errors: [String!]!
}

type LargeLanguageModelPayload {
  largeLanguageModel: LargeLanguageModel
  errors: [String!]!
}

type ProjectConnection {
  nodes: [Project!]!
  pageInfo: ProjectPageInfo!
  totalCount: Int!
}

type ItemConnection {
  nodes: [Item!]!
  pageInfo: ItemPageInfo!
  totalCount: Int!
}

type DashboardSummary {
  projectsInFlight: Int!
  featuresInReview: Int!
  featuresFailed: Int!
  tasksInProgress: Int!
  tasksFailed: Int!
}

type Project {
  id: ID
  name: String
  description: String
  architecture: String
  memory: String
  repository: String
  githubUrl: String
  githubToken_Encrypted: String
  createdAt: DateTime
  updatedAt: DateTime
  items: [Item]
  llms: [LargeLanguageModel!]!
}

type Deliverable {
  id: ID
  projectId: ID
  type: DeliverableType
  title: String
  status: DeliverableStatus
  description: String
  acceptanceCriteria: String
  agentFeedback: String
  executionPlan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  blocking: String
  result: String
  errors: String
  createdAt: DateTime
  updatedAt: DateTime
  severity: Severity
  rootCause: String
  tasks: [AgentTask]
  project: Project
}

type AgentTask {
  id: ID
  projectId: ID
  deliverableId: ID
  title: String
  status: AgentTaskStatus
  result: String
  errors: String
  commitHash: String
  complexityRating: Int
  dependsOnDevTask: String
  promptTokens: Int
  completionTokens: Int
  executionDurationInSeconds: Float
  model: String
  createdAt: DateTime
  updatedAt: DateTime
  deliverable: Deliverable
  project: Project
}

type Item {
  id: ID
  projectId: ID
  subtype: ItemSubtype!
  title: String
  status: FeatureStatus
  description: String
  acceptanceCriteria: String
  plan: String
  securityImpact: String
  performanceImpact: String
  testPlan: String
  deploymentPlan: String
  openQuestions: String
  result: String
  errors: String
  createdAt: DateTime
  updatedAt: DateTime
  parentFeatureId: ID
  severity: Severity
  rootCause: String
  dependsOnId: ID
  project: Project
}

type LargeLanguageModel {
  id: ID
  projectId: ID
  url: String
  model: String
  modelAlias: String
  apiKey_Encrypted: String
  maxComplexity: Int
  maxConcurrency: Int
  createdAt: DateTime
  updatedAt: DateTime
  project: Project
}

enum DeliverableType {
  FEATURE
  DEFECT
  MAINTENANCE
}

enum DeliverableStatus {
  DRAFT
  PLANNING
  READY
  IN_PROGRESS
  DONE
  FAILED
  REJECTED
  NEEDS_REVIEW
}

enum AgentTaskStatus {
  READY
  IN_PROGRESS
  DONE
  FAILED
  REJECTED
  NEEDS_REVIEW
}

enum FeatureStatus {
  PLANNING
  READY
  IN_PROGRESS
  READY_FOR_TEST
  TESTING
  DONE
  FAILED
  REJECTED
  IN_REVIEW
}

enum ItemSubtype {
  FEATURE
  DEFECT
  MAINTENANCE
  ENABLER
  TASK
}

enum Severity {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

scalar DateTime
scalar UUID

type Query {
  projectById(id: UUID!): Project
  projects(first: Int! = 50, skip: Int): ProjectConnection!
  items(projectId: UUID, status: [FeatureStatus!], subtype: [ItemSubtype!], createdAfter: DateTime, createdBefore: DateTime, first: Int! = 50, skip: Int): ItemConnection!
  getItemById(id: UUID!): Item
  largeLanguageModelById(id: UUID!): LargeLanguageModel
  largeLanguageModels(projectId: UUID): [LargeLanguageModel!]!
  dashboardSummary: DashboardSummary!
}

type Mutation {
  createProject(input: CreateProjectInput!): ProjectPayload!
  updateProject(input: UpdateProjectInput!): ProjectPayload!
  deleteProject(input: DeleteProjectInput!): ProjectPayload!
  createDeliverable(input: CreateDeliverableInput!): DeliverablePayload!
  updateDeliverable(input: UpdateDeliverableInput!): DeliverablePayload!
  transitionDeliverableStatus(input: TransitionDeliverableInput!): DeliverablePayload!
  deleteDeliverable(input: DeleteDeliverableInput!): DeliverablePayload!
  createAgentTask(input: CreateAgentTaskInput!): AgentTaskPayload!
  updateAgentTask(input: UpdateAgentTaskInput!): AgentTaskPayload!
  transitionAgentTaskStatus(input: TransitionAgentTaskInput!): AgentTaskPayload!
  deleteAgentTask(input: DeleteAgentTaskInput!): AgentTaskPayload!
  createLargeLanguageModel(input: CreateLargeLanguageModelInput!): LargeLanguageModelPayload!
  updateLargeLanguageModel(input: UpdateLargeLanguageModelInput!): LargeLanguageModelPayload!
  deleteLargeLanguageModel(input: DeleteLargeLanguageModelInput!): LargeLanguageModelPayload!
  cleanupTestData: CleanupTestDataPayload!
}

type CleanupTestDataPayload {
  success: Boolean!
  message: String
}

directive @cost(weight: String!) on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | INPUT_FIELD_DEFINITION
