type Query {
    dashboardSummary: DashboardSummary!
    projects(first: Int, skip: Int): ProjectConnection!
    projectById(id: ID!): Project
    features(first: Int, skip: Int, projectId: ID, status: [FeatureStatus!]): FeatureConnection!
    featureById(id: ID!): Feature
    defects(first: Int, skip: Int): DefectConnection!
    defectById(id: ID!): Defect
    tasks(first: Int, skip: Int): TaskConnection!
    taskById(id: ID!): Task
    modelConfigurations(projectId: ID!): [ModelConfiguration!]!
}

type Mutation {
    createProject(input: CreateProjectInput!): Project!
    updateProject(id: ID!, input: UpdateProjectInput!): Project
    createFeature(input: CreateFeatureInput!): Feature!
    updateFeature(id: ID!, input: UpdateFeatureInput!): Feature
    transitionFeatureStatus(
        id: ID!
        targetStatus: FeatureStatus!
        actor: String!
    ): FeatureStatusTransition
    createDefect(input: CreateDefectInput!): Defect!
    updateDefect(id: ID!, input: UpdateDefectInput!): Defect
    createTask(input: CreateTaskInput!): Task!
    updateTask(id: ID!, input: UpdateTaskInput!): Task
    createModelConfiguration(input: CreateModelConfigurationInput!): ModelConfiguration!
    updateModelConfiguration(id: ID!, input: UpdateModelConfigurationInput!): ModelConfiguration
    deleteModelConfiguration(id: ID!): ModelConfiguration
}

type DashboardSummary {
    projectsInFlight: Int!
    featuresInReview: Int!
    featuresFailed: Int!
    tasksInProgress: Int!
    tasksFailed: Int!
    recentAuditEvents: [AuditEvent!]!
}

type AuditEvent {
    id: ID!
    entityType: String!
    entityId: String!
    eventType: String!
    actor: String
    occurredAt: String!
}

type Project {
    id: ID!
    name: String!
    description: String
    architecture: String
    memory: String
    githubUrl: String
    createdAt: String!
    updatedAt: String!
}

type ProjectConnection {
    nodes: [Project!]!
    pageInfo: PageInfo!
    totalCount: Int!
}

type Feature {
    id: ID!
    title: String!
    description: String
    acceptanceCriteria: String
    plan: String
    securityImpact: String
    performanceImpact: String
    testPlan: String
    deploymentPlan: String
    openQuestions: String
    result: String
    errors: String
    status: FeatureStatus!
    project: Project
    tasks: [Task!]!
    validStatusTransitions: [FeatureStatus!]!
    createdAt: String!
    updatedAt: String!
}

type FeatureConnection {
    nodes: [Feature!]!
    pageInfo: PageInfo!
  totalCount: Int!
}

type Defect {
    id: ID!
    title: String!
    description: String
    acceptanceCriteria: String
    plan: String
    result: String
    errors: String
    securityImpact: String
    performanceImpact: String
    status: DefectStatus!
    severity: DefectSeverity!
    parentFeature: Feature
    project: Project
    createdAt: String!
    updatedAt: String!
    version: Int
}

type DefectConnection {
    nodes: [Defect!]!
    pageInfo: PageInfo!
totalCount: Int!
}

type ModelConfiguration {
    id: ID!
    projectId: ID!
    url: String!
    model: String!
    modelAlias: String
    apiKey_Encrypted: String!
    maxComplexity: Int!
    createdAt: String!
    updatedAt: String!
}

type TaskConnection {
    nodes: [Task!]!
    pageInfo: PageInfo!
    totalCount: Int!
}

type TaskEdge {
    node: Task!
    cursor: String!
}

type PageInfo {
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
    totalCount: Int!
}

input CreateProjectInput {
    name: String!
    description: String
    architecture: String
    memory: String
    githubUrl: String
}

input UpdateProjectInput {
    name: String
    description: String
    architecture: String
    memory: String
    githubUrl: String
    githubToken_Encrypted: String
    version: Int!
}

input CreateFeatureInput {
    title: String!
    description: String
    acceptanceCriteria: String
    plan: String
    securityImpact: String
    performanceImpact: String
    testPlan: String
    deploymentPlan: String
    openQuestions: String
    projectId: ID!
}

input UpdateFeatureInput {
    title: String
    description: String
    acceptanceCriteria: String
    plan: String
    securityImpact: String
    performanceImpact: String
    testPlan: String
    deploymentPlan: String
    openQuestions: String
}

input CreateDefectInput {
    title: String!
    description: String
    acceptanceCriteria: String
    plan: String
    result: String
    errors: String
    securityImpact: String
    performanceImpact: String
    severity: DefectSeverity!
    projectId: ID!
    parentFeatureId: ID
}

input UpdateDefectInput {
    title: String
    description: String
    acceptanceCriteria: String
    plan: String
    result: String
    errors: String
    securityImpact: String
    performanceImpact: String
    severity: DefectSeverity
    version: Int!
}

input CreateTaskInput {
    title: String!
    deliverable: String
    acceptanceCriteria: String
    risks: String
    requiredFollowUps: String
    complexity: TaskComplexity!
    featureId: ID!
}

input UpdateTaskInput {
    title: String
    deliverable: String
    acceptanceCriteria: String
    risks: String
    requiredFollowUps: String
    complexity: TaskComplexity
    status: TaskStatus
    version: Int!
}

input CreateModelConfigurationInput {
    projectId: ID!
    url: String!
    model: String!
    modelAlias: String
    apiKey: String!
    maxComplexity: Int!
}

input UpdateModelConfigurationInput {
    url: String
    model: String
    modelAlias: String
    apiKey: String
    maxComplexity: Int
}

enum FeatureStatus {
    Planned
    InProgress
    Review
    Done
}

enum DefectStatus {
    Reported
    Triaged
    InProgress
    Resolved
    Closed
}

enum DefectSeverity {
    Critical
    High
    Medium
    Low
}

enum TaskComplexity {
    Simple
    Moderate
    Complex
    Major
}

enum TaskStatus {
    Todo
    InProgress
    Review
    Done
}
