mutation CreateAgentTask($input: CreateAgentTaskInput!) {
    createAgentTask(input: $input) {
        agentTask {
            id
            title
            deliverableId
            complexityRating
            result
            errors
            commitHash
            dependsOnDevTask
            promptTokens
            completionTokens
            executionDurationInSeconds
            model
        }
        errors
    }
}
