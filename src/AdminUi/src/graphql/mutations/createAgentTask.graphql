mutation CreateAgentTask($input: CreateAgentTaskInput!) {
    createAgentTask(input: $input) {
        id
        projectId
        deliverableId
        title
        status
        description
        complexityRating
        result
        errors
        commitHash
        dependsOnAgentTaskId
        promptTokens
        completionTokens
        executionDurationInSeconds
        agent
    }
}
