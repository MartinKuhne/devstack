mutation CreateAgentTask($input: CreateAgentTaskInput!) {
    createAgentTask(input: $input) {
        task {
            id
            title
            deliverable
            acceptanceCriteria
            risks
            requiredFollowUps
            complexityRating
            result
            status
            itemId
            promptTokens
            completionTokens
            executionDurationInSeconds
            model
            commitHash
            createdAt
            updatedAt
        }
        errors
    }
}
