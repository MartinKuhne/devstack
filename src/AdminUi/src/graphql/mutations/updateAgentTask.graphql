mutation UpdateAgentTask($input: UpdateAgentTaskInput!) {
    updateAgentTask(input: $input) {
        agentTask {
            id
            title
            deliverableId
            description
            complexityRating
            result
            errors
            commitHash
            dependsOnAgentTaskId
            promptTokens
            completionTokens
            executionDurationInSeconds
            agent
        }
        errors
    }
}
