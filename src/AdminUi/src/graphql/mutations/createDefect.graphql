mutation CreateDefect($input: CreateDefectInput!) {
    createDefect(input: $input) {
        defect {
            id
            title
            description
            acceptanceCriteria
            plan
            result
            errors
            securityImpact
            performanceImpact
            status
            severity
            projectId
            parentFeatureId
            createdAt
            updatedAt
        }
        errors
    }
}
