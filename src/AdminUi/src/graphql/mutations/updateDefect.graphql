mutation UpdateDefect($input: UpdateDefectInput!) {
    updateDefect(input: $input) {
        defect {
            id
            title
            description
            acceptanceCriteria
            plan
            result
            errors
            securityImpact
            performanceImpact
            status
            severity
            projectId
            parentFeatureId
            updatedAt
        }
        errors
    }
}
