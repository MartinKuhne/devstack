query GetAllDeliverables {
    deliverables {
        nodes {
            id
            title
            description
            status
            type
            projectId
            acceptanceCriteria
            executionPlan
            agentFeedback
            securityImpact
            performanceImpact
            testPlan
            deploymentPlan
            blocking
        }
    }
}

query GetDeliverablesByProject($projectId: UUID!) {
    deliverables(where: { projectId: { eq: $projectId } }) {
        nodes {
            id
            title
            description
            status
            type
            projectId
            acceptanceCriteria
            executionPlan
            agentFeedback
            securityImpact
            performanceImpact
            testPlan
            deploymentPlan
            blocking
        }
    }
}

query GetDeliverable($id: UUID!) {
    deliverable(id: $id) {
        id
        title
        description
        status
        type
        projectId
        acceptanceCriteria
        executionPlan
        agentFeedback
        securityImpact
        performanceImpact
        testPlan
        deploymentPlan
        blocking
    }
}
