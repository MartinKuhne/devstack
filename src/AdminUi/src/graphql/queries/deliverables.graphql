query GetAllDeliverables($first: Int, $after: String, $where: DeliverableFilterInput) {
    deliverables(first: $first, after: $after, where: $where) {
        nodes {
            id
            title
            description
            status
            type
            projectId
            acceptanceCriteria
            executionPlan
            agentFeedback
            securityImpact
            performanceImpact
            testPlan
            deploymentPlan
            blocking
            design
        }
        pageInfo {
            hasNextPage
            endCursor
        }
    }
}

query GetDeliverablesByProject($projectId: UUID!) {
    deliverables(where: { projectId: { eq: $projectId } }, first: 100) {
        nodes {
            id
            title
            description
            status
            type
            projectId
            acceptanceCriteria
            executionPlan
            agentFeedback
            securityImpact
            performanceImpact
            testPlan
            deploymentPlan
            blocking
            design
        }
    }
}

query GetDeliverable($id: UUID!) {
    deliverable(id: $id) {
        id
        title
        description
        status
        type
        projectId
        acceptanceCriteria
        executionPlan
        agentFeedback
        securityImpact
        performanceImpact
        testPlan
        deploymentPlan
        blocking
        design
        agentTasks {
            id
            title
            status
            promptTokens
            completionTokens
        }
    }
}
