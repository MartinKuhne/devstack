query GetDeliverables {
    deliverables {
        nodes {
            id
            title
            description
            status
            type
            acceptanceCriteria
            executionPlan
            agentFeedback
            securityImpact
            performanceImpact
            testPlan
            deploymentPlan
            blocking
        }
    }
}

query GetDeliverable($id: UUID!) {
    deliverable(id: $id) {
        id
        title
        description
        status
        type
        acceptanceCriteria
        executionPlan
        agentFeedback
        securityImpact
        performanceImpact
        testPlan
        deploymentPlan
        blocking
    }
}
