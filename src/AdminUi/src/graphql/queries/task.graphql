query GetTaskById($id: UUID!) {
    taskById(id: $id) {
        id
        title
        deliverable
        acceptanceCriteria
        risks
        requiredFollowUps
        complexityRating
        result
        status
        itemId
        createdAt
        updatedAt
    }
}

query GetTasks($itemId: UUID, $status: [TaskStatus!]) {
    tasks(itemId: $itemId, status: $status) {
        nodes {
            id
            title
            deliverable
            acceptanceCriteria
            risks
            requiredFollowUps
            complexityRating
            result
            status
            itemId
            createdAt
            updatedAt
        }
    }
}
