query GetEpics($title: String) {
    items(subtype: [EPIC], first: 50, skip: null) {
        nodes {
            id
            title
            description
            createdAt
            updatedAt
        }
        pageInfo {
            hasNextPage
            hasPreviousPage
            totalCount
        }
        totalCount
    }
}

query GetEpicById($id: UUID!) {
    getItemById(id: $id) {
        id
        title
        description
        createdAt
        updatedAt
    }
}
