query GetAgentTask($id: UUID!) {
    agentTask(id: $id) {
        id
        title
        status
        deliverableId
        description
        result
        errors
        commitHash
        complexityRating
        dependsOnAgentTaskId
        promptTokens
        completionTokens
        executionDurationInSeconds
        agent
    }
}

query GetAgentTasks($deliverableId: UUID) {
    agentTasks(filter: { deliverableId: { eq: $deliverableId } }) {
        nodes {
            id
            title
            status
            deliverableId
            description
            result
            errors
            commitHash
            complexityRating
            dependsOnAgentTaskId
            promptTokens
            completionTokens
            executionDurationInSeconds
            agent
        }
    }
}
