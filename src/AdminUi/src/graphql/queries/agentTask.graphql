query GetAgentTaskById($id: UUID!) {
    agentTaskById(id: $id) {
        id
        title
        status
        deliverableId
        description
        result
        errors
        commitHash
        complexityRating
        dependsOnAgentTaskId
        promptTokens
        completionTokens
        executionDurationInSeconds
        agent
    }
}

query GetAgentTasks($deliverableId: UUID) {
    agentTasks(deliverableId: $deliverableId) {
        nodes {
            id
            title
            status
            deliverableId
            description
            result
            errors
            commitHash
            complexityRating
            dependsOnAgentTaskId
            promptTokens
            completionTokens
            executionDurationInSeconds
            agent
        }
    }
}
