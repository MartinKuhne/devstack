query GetAgentTaskById($id: UUID!) {
    agentTaskById(id: $id) {
        id
        title
        deliverable
        acceptanceCriteria
        risks
        requiredFollowUps
        complexityRating
        result
        status
        itemId
        item {
            id
            title
        }
        dependsOnAgentTask {
            id
            title
        }
        promptTokens
        completionTokens
        executionDurationInSeconds
        model
        commitHash
        errors
        createdAt
        updatedAt
    }
}

query GetAgentTasks($itemId: UUID, $status: [AgentTaskStatus!]) {
    agentTasks(itemId: $itemId, status: $status) {
        nodes {
            id
            title
            deliverable
            status
            itemId
            complexityRating
            promptTokens
            completionTokens
            executionDurationInSeconds
            model
            commitHash
            createdAt
            updatedAt
        }
    }
}
