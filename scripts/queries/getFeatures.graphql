query GetFeatures($projectId: UUID!, $first: Int!) {
  features(projectId: $projectId, first: $first) {
    nodes {
      id
      title
      status
      description
      acceptanceCriteria
      plan
      featureSubtype
      epicId
      type
      agentFeedback
      executionPlan
      securityImpact
      performanceImpact
      testPlan
      deploymentPlan
      blocking
    }
  }
}
