query GetTasks($projectId: UUID!, $first: Int!) {
  tasks(projectId: $projectId, first: $first) {
    nodes {
      id
      title
      status
      deliverable
      acceptanceCriteria
      risks
      itemId
      projectId
      result
      errors
      commitHash
      complexityRating
      dependsOnDevTask
      promptTokens
      completionTokens
      executionDurationInSeconds
      model
      item {
        id
        title
        description
      }
    }
  }
}
