name: Agent Process CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/AgentProcess/**'
      - '.github/workflows/agent-process-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/AgentProcess/**'
      - '.github/workflows/agent-process-ci.yml'

env:
  NODE_VERSION: '20.x'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/AgentProcess/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: src/AgentProcess

    - name: Type Check
      run: npm run typecheck
      working-directory: src/AgentProcess

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/AgentProcess/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: src/AgentProcess

    - name: Test
      run: npm run test
      working-directory: src/AgentProcess

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/AgentProcess/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: src/AgentProcess

    - name: Build
      run: npm run build
      working-directory: src/AgentProcess

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t agent-process:${{ github.sha }} src/AgentProcess
