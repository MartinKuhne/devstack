name: Playwright E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/AdminUi/**'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/AdminUi/**'
      - '.github/workflows/playwright-e2e.yml'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/AdminUi/tests/e2e/package-lock.json

      - name: Install dependencies
        working-directory: src/AdminUi/tests/e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: src/AdminUi/tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Build Admin UI
        working-directory: src/AdminUi
        run: |
          npm ci
          npm run build

      - name: Start services
        run: |
          docker compose up -d
          docker compose ps

      - name: Wait for services to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8087/health > /dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API to be ready... ($i/30)"
            sleep 2
          done
          echo "API failed to start"
          docker compose logs
          exit 1

      - name: Run Playwright tests
        working-directory: src/AdminUi/tests/e2e
        run: npx playwright test --reporter=json,junit
        env:
          CI: true
          API_URL: http://localhost:8087
          TEST_PROJECT_ID: test-project-ci
          TEST_API_KEY: sk-test-ci-key

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/AdminUi/reports/
            src/AdminUi/tests/e2e/test-results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/AdminUi/coverage/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down -v

  test-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      actions: read
      pull-requests: write
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: reports/

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Playwright Test Results
          path: reports/results.xml
          reporter: playwright
