name: Build API

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/Server/**'
      - '.github/workflows/build-api.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/Server/**'
      - '.github/workflows/build-api.yml'

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'
  DEVSTACK_TEST_API_IMAGE: devstack-api:${{ github.sha }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore src/Server/DevStack.slnx

    - name: Build
      run: dotnet build src/Server/DevStack.slnx --configuration Release --no-restore

    - name: Build API test image
      run: docker build --tag "$DEVSTACK_TEST_API_IMAGE" -f src/Server/DevStack.Api/Dockerfile src/Server

    - name: Test (unit and integration)
      run: dotnet test --solution src/Server/DevStack.slnx --configuration Release --no-build --verbosity normal
 
