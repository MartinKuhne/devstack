name: Build API

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/Server/**'
      - '.github/workflows/build-api.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/Server/**'
      - '.github/workflows/build-api.yml'

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore src/Server/DevStack.slnx

    - name: Build
      run: dotnet build src/Server/DevStack.slnx --configuration Release --no-restore

    - name: Test (unit)
      # Testcontainers-based integration tests (DevStack.Tests.Integration.GraphQL,
      # DevStack.Tests.Integration.MCP) are NOT run here. They require a Docker
      # daemon, are slow, and are partitioned into a dedicated workflow that only
      # runs when the relevant slice of code changes. See
      # .github/workflows/integration-tests.yml.
      run: dotnet test src/Server/DevStack.slnx --filter "FullyQualifiedName!~Integration" --configuration Release --no-build --verbosity normal

    - name: Docker Build
      run: docker build -t devstack-api:${{ github.sha }} -f src/Server/DevStack.Api/Dockerfile src/Server
 
