name: Build and Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Agent
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - run: npm ci
    - run: npm run typecheck
    - run: npm run lint
    - run: npm run test
    - run: npm run build

  build-adminui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AdminUi
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - run: npm ci
    - run: npm run typecheck
    - run: npm run lint
    - run: npm run test
    - run: npm run build

  build-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Server
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore DevStack.slnx
    - name: Build
      run: dotnet build DevStack.slnx --no-restore
    - name: Test
      run: dotnet test DevStack.Tests.Unit/DevStack.Tests.Unit.csproj --no-build --verbosity normal
