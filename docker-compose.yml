services:
  redis:
    image: redis:7-alpine
    container_name: devstack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: devstack-postgres
    environment:
      POSTGRES_USER: devstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devstack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstack -d devstack"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devstack-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      DEVSTACK_SECRET_KEY: ${DEVSTACK_SECRET_KEY}
    ports:
      - "8087:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-worker:
    build:
      context: ./src/AgentProcess
      dockerfile: Dockerfile
    container_name: devstack-agent-worker
    environment:
      NODE_ENV: Production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_GRAPHQL_URL: ${API_GRAPHQL_URL:-http://api:8080/graphql}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  admin-ui:
    build:
      context: ./src/AdminUi
      dockerfile: Dockerfile
    container_name: devstack-admin-ui
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/graphql}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
