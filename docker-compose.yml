services:
  postgres:
    image: postgres:17-alpine
    container_name: devstack-postgres
    environment:
      POSTGRES_USER: devstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devstack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstack -d devstack"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  graphql-postgres:
    image: postgres:17-alpine
    container_name: devstack-graphql-postgres
    environment:
      POSTGRES_USER: devstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devstack_graphql
    ports:
      - "5433:5432"
    volumes:
      - graphql_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devstack_graphql"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./src/Server
      dockerfile: DevStack.Api/Dockerfile
    container_name: devstack-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=devstack;Username=devstack;Password=${POSTGRES_PASSWORD};
      DEVSTACK_SECRET_KEY: ${DEVSTACK_SECRET_KEY}
    ports:
      - "8087:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build:
      context: ./src/Server
      dockerfile: DevStack.Mcp/Dockerfile
    container_name: devstack-mcp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: postgresql://devstack:${POSTGRES_PASSWORD}@postgres:5432/devstack
      DEVSTACK_SECRET_KEY: ${DEVSTACK_SECRET_KEY}
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin-ui:
    build:
      context: ./src/AdminUi
      dockerfile: Dockerfile
    container_name: devstack-admin-ui
    environment:
      GRAPHQL_API_URL: http://localhost:8087/graphql
    ports:
      - "5173:80"
    depends_on:
      - api

  graphql-api:
    build:
      context: ./src/graphql
      dockerfile: Dockerfile
    container_name: devstack-graphql-api
    environment:
      DATABASE_URL: postgresql://devstack:${POSTGRES_PASSWORD}@graphql-postgres:5432/devstack_graphql
      PORT: 4000
      NODE_ENV: production
      ENCRYPTION_KEY: ${GRAPHQL_ENCRYPTION_KEY}
    ports:
      - "4000:4000"
    depends_on:
      graphql-postgres:
        condition: service_healthy


volumes:
  postgres_data:
  graphql_postgres_data:
