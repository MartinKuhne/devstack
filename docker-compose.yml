services:
  postgres:
    image: postgres:17-alpine
    container_name: devstack-postgres
    environment:
      POSTGRES_USER: devstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devstack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstack -d devstack"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devstack-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      DEVSTACK_SECRET_KEY: ${DEVSTACK_SECRET_KEY}
    ports:
      - "8087:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin-ui:
    build:
      context: ./src/AdminUi
      dockerfile: Dockerfile
    container_name: devstack-admin-ui
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/graphql}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
